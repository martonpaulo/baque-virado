<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Baque Virado</title>
<meta name="description" content="Maracatu de baque virado: 7 baques, 5 instrumentos, partitura e microtempo medido, com som de instrumentos reais.">
<meta property="og:title" content="O Baque Virado">
<meta property="og:description" content="Maracatu de baque virado: 7 baques, 5 instrumentos, partitura e microtempo medido, com som de instrumentos reais.">
<meta name="theme-color" content="#07060b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2307060b' stroke='%23ffc53d' stroke-width='3'/%3E%3Ccircle cx='16' cy='5' r='3' fill='%23ffc53d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@300;400;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<!-- Static text stays here (works without JS, crawlable); copy for dynamic text lives in src/copy.js. -->
<div class="wrap">
  <section class="stage" id="stage" aria-label="Animação: o baque virado do maracatu">
    <canvas id="fx"></canvas>
    <canvas id="bg"></canvas>
    <div class="inner">
      <div class="hud"><div><span id="hSec"></span><br><b id="hBar"></b> · <b id="hStep"></b></div><div class="r">♩ = <b id="hBpm"></b> bpm<br><b id="hTime"></b></div></div>
      <header class="head" id="head"></header>
      <div class="scope" id="scopeBox"><svg id="scope" viewBox="-135 -135 270 270" role="img" aria-label="Roda de 16 semicolcheias com um anel por instrumento"></svg></div>
      <section class="read" id="read"></section>
      <div class="lanes"><canvas id="lanes"></canvas></div>
    </div>
  </section>

  <aside class="side left">
    <header class="brand"><h1>O Baque<br>Virado</h1><p id="facts"></p></header>
    <div class="trow"><button id="play" type="button"></button><span id="clock"></span></div>
    <nav class="chips" id="chips" aria-label="Cenas"></nav>
    <div class="sounds" id="soundsLeft"></div>
  </aside>

  <aside class="side right">
    <div class="sounds" id="soundsRight"></div>
    <p class="lbl keys">espaço: tocar / pausar · ← →: cena</p>
    <p class="foot"><a href="https://github.com/martonpaulo/baque-virado">código</a><a href="https://github.com/martonpaulo/baque-virado/blob/main/CREDITS.md">créditos dos sons</a></p>
  </aside>
</div>
</body>
</html>
