<body>
<!-- Static text stays here (works without JS, crawlable); copy for dynamic text lives in src/copy.js. -->
<div class="wrap">
  <section class="stage" id="stage" aria-label="Animação: o baque virado do maracatu">
    <canvas id="fx"></canvas>
    <canvas id="bg"></canvas>
    <div class="inner">
      <div class="hud"><div><span id="hSec"></span><br><b id="hBar"></b> · <b id="hStep"></b></div><div class="r">♩ = <b id="hBpm"></b> bpm<br><b id="hTime"></b></div></div>
      <header class="head" id="head"></header>
      <div class="scope" id="scopeBox"><svg id="scope" role="img" aria-label="Roda de 16 semicolcheias com um anel por instrumento"></svg></div>
      <section class="read" id="read"></section>
      <div class="lanes"><p class="key" id="key"></p><canvas id="lanes"></canvas></div>
    </div>
  </section>

  <aside class="side left">
    <header class="brand"><h1>O Baque<br>Virado</h1><p id="facts"></p></header>
    <div class="trow"><button id="play" type="button"></button><span id="clock"></span></div>
    <nav class="chips" id="chips" aria-label="Cenas"></nav>
    <div class="sounds" id="soundsLeft"></div>
  </aside>

  <aside class="side right">
    <div class="sounds" id="soundsRight"></div>
    <p class="lbl keys">espaço: tocar / pausar · ← →: cena</p>
    <p class="foot"><a href="https://github.com/martonpaulo/baque-virado">código</a><a href="https://github.com/martonpaulo/baque-virado/blob/main/CREDITS.md">créditos dos sons</a></p>
  </aside>
</div>
</body>
