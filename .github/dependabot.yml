# Fleet Dependabot configuration (skills/skd-project-standards/references/fleet-conventions.md, #265).
# Copied from martonpaulo/atlastint, the configuration the fleet adopted on 2026-09-12.
# Keep the ecosystem entries the repository actually has: `npm` covers pnpm projects too;
# drop `github-actions` when there is no .github/workflows directory. Keep a `swift` entry only
# when Package.swift declares a `.package(` dependency; drop it, and record a `dependabot`
# divergence, when Dependabot's Swift is older than the package's swift-tools-version (#519). Majors are ignored and
# reviewed by hand; the cooldown keeps a day-old release out of a pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
