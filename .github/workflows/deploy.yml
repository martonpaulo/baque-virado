name: Deploy

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only a validated push to this repository's main deploys: a fork's pull request from its own
    # `main` also matches `branches: [main]`, and must never reach Pages.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip a commit that is no longer the tip of main
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "A newer commit is on main; its own run deploys it."; fi
      # A manual deploy has no Validate run behind it, so it runs the same gate first (#9).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.tip.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: pnpm
      - name: Validate before a manual deploy
        if: steps.tip.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          pnpm install --frozen-lockfile
          node tools/install-browser.mjs
          pnpm validate
      - name: Build the site (only what the browser loads, plus the deployed commit)
        if: steps.tip.outputs.current == 'true'
        run: |
          mkdir _site
          cp -R index.html 404.html styles.css src social.png apple-touch-icon.png CNAME .nojekyll _site/
          # the page fetches only the AAC samples; the WAV masters stay in the repository
          mkdir _site/sounds
          cp sounds/*.m4a _site/sounds/
          mkdir _site/fonts
          cp fonts/*.woff2 fonts/OFL-*.txt _site/fonts/
          echo "${{ github.event.workflow_run.head_sha || github.sha }}" > _site/build.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.tip.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.tip.outputs.current == 'true'
      - id: deployment
        if: steps.tip.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Read the live site back
        if: steps.tip.outputs.current == 'true'
        run: python3 scripts/live_build_check.py "${{ steps.deployment.outputs.page_url }}build.txt" "${{ github.event.workflow_run.head_sha || github.sha }}"
